name = "aicodinghunt"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "SUBMISSIONS"
bucket_name = "aicodinghunt-submissions"
